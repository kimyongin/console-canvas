<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>Console Canvas</title><link rel="stylesheet" href="shell.css"></head><body><header><div class="top"><strong><span>▧</span> Console Canvas</strong><nav><button id="show-source" class="active">웹사이트</button><button id="show-editor">편집기</button></nav><small id="status" role="status">원하는 화면을 열어 주세요.</small><button id="capture" class="primary">이 화면 가져오기 →</button></div><form id="navigation"><button id="back" type="button" aria-label="뒤로">←</button><button id="forward" type="button" aria-label="앞으로">→</button><button id="reload" type="button" aria-label="새로고침">↻</button><input id="address" type="text" aria-label="웹사이트 주소" placeholder="https://console.example.com"><button type="submit">열기</button><button id="demo" type="button">샘플 콘솔</button></form></header><main><h1>원본 사이트와 편집을 한 곳에서</h1><p>위 주소창에 사이트를 열고, 원하는 화면에서 가져오기를 누르세요.</p></main><script src="shell.cjs"></script></body></html>
