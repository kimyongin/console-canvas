<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Console Canvas integration checks</title>
    <style>
      body {
        font:
          13px/1.7 system-ui,
          sans-serif;
        padding: 30px;
        background: #f5f6fa;
        color: #30384c;
      }
      #results {
        white-space: pre-wrap;
      }
      iframe {
        width: 1360px;
        height: 1200px;
        position: absolute;
        left: -18000px;
        top: 0;
      }
      button {
        padding: 12px;
        margin-right: 10px;
      }
      .pass {
        color: #257458;
      }
      .fail {
        color: #ba3e57;
      }
    </style>
  </head>
  <body>
    <h1>Console Canvas — integration checks</h1>
    <div id="status" role="status">Running…</div>
    <pre id="results"></pre>
    <iframe id="source" src="../fixtures/console.html" title="Independent source console"></iframe
    ><iframe id="clone" sandbox="allow-same-origin" title="Editable cloned console"></iframe>
    <script src="../capture.js"></script>
    <script type="module" src="core-editor.js"></script>
  </body>
</html>
